apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 654654251757.dkr.ecr.us-east-1.amazonaws.com/bookstore-auth:latest
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: API_BASE_PATH
              value: "/api"
            - name: DB_HOST
              value: "bookstore-db.ctack6qkgxz8.us-east-1.rds.amazonaws.com"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgrespassword123"
            - name: DB_NAME
              value: "postgres"
            - name: DB_SCHEMA
              value: "schema_auth"
            - name: DB_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
            - name: AUTH_JWT_SECRET
              value: "mi-secreto-jwt-super-seguro-12345"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
