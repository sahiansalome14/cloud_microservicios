apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: 654654251757.dkr.ecr.us-east-1.amazonaws.com/bookstore-catalog:latest
          ports:
            - name: http
              containerPort: 5002
            - name: grpc
              containerPort: 50051
          env:
            - name: PORT
              value: "5002"
            - name: API_BASE_PATH
              value: "/api"
            - name: GRPC_PORT
              value: "50051"
            - name: DB_HOST
              value: "bookstore-db.ctack6qkgxz8.us-east-1.rds.amazonaws.com"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgrespassword123"
            - name: DB_NAME
              value: "postgres"
            - name: DB_SCHEMA
              value: "schema_catalog"
            - name: DB_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
    - name: grpc
      port: 50051
      targetPort: 50051
