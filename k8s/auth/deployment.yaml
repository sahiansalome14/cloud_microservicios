apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: 
    app: auth-service
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: auth-service
    
  template: 
    metadata:
      labels: 
        app: auth-service
    spec: 
      containers:
      - name: auth-service
        image: 654654251757.dkr.ecr.us-east-1.amazonaws.com/bookstore-auth:latest
        ports:
        - containerPort: 5001 
        envFrom: 
          - ConfigMapRef:
            name: auth-configmap
          - secretRef:
            name: auth-secret




       

